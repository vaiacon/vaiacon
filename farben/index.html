<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terracotta-Varianten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F4EDE1; --cream50: #FBF4EE; --card: #FFFDF8; --ink: #1C1613; --brown: #5A524B; --muted: #8C8178; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Quicksand', -apple-system, sans-serif; }
  header.kopf { max-width: 1180px; margin: 0 auto; padding: 32px 16px 8px; }
  header.kopf h1 { margin: 0 0 6px; font-size: 28px; }
  header.kopf p { margin: 0; color: var(--brown); font-weight: 500; }
  .raster { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
  .v { background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: 0 1px 0 rgba(28,22,19,.08), 0 12px 30px -18px rgba(28,22,19,.35); }
  .v.heute { outline: 2px dashed var(--muted); outline-offset: 3px; }
  .hero { position: relative; height: 270px; background: var(--hero); color: #fff; padding: 16px 18px; overflow: hidden; }
  .nav { display: flex; align-items: center; justify-content: space-between; background: rgba(251,244,238,.96); border-radius: 999px; padding: 6px 6px 6px 16px; color: var(--ink); font-weight: 700; font-size: 13px; }
  .nav span.links { display: flex; gap: 12px; font-weight: 600; color: var(--brown); font-size: 12px; }
  .knopf { display: inline-block; border: 0; border-radius: 999px; padding: 9px 16px; font: 700 13px/1 'Quicksand', sans-serif; background: var(--btn); color: #fff; box-shadow: 0 12px 26px -12px rgba(60,20,5,.5); cursor: pointer; transition: background .2s; }
  .knopf:hover { background: var(--btnh); }
  .hero h2 { position: absolute; left: 18px; bottom: 54px; margin: 0; font-size: 25px; line-height: 1.12; max-width: 58%; text-shadow: 0 1px 12px rgba(40,10,0,.25); }
  .hero .hell { position: absolute; left: 18px; bottom: 16px; background: var(--cream50); color: var(--deep); box-shadow: 0 12px 26px -12px rgba(40,10,0,.6); }
  .hero img { position: absolute; right: -4px; bottom: -6px; height: 205px; }
  .band { height: 46px; background: var(--section); }
  .inhalt { padding: 18px 18px 14px; }
  .kicker { font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--link); }
  .inhalt h3 { margin: 8px 0 4px; font-size: 19px; }
  .inhalt p { margin: 0 0 12px; color: var(--brown); font-size: 14px; font-weight: 500; }
  .inhalt a { color: var(--link); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid currentColor; }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .name { display: flex; align-items: baseline; gap: 8px; padding: 0 18px 4px; }
  .name b { font-size: 18px; }
  .name i { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 600; }
  .muster { display: flex; padding: 10px 18px 18px; gap: 6px; }
  .muster div { flex: 1; }
  .muster span { display: block; height: 34px; border-radius: 8px; background: var(--c); border: 1px solid rgba(28,22,19,.1); }
  .muster small { display: block; margin-top: 4px; font: 500 10px/1.2 'IBM Plex Mono', monospace; color: var(--muted); }
  .kontrast { font: 500 11px/1.3 'IBM Plex Mono', monospace; color: var(--muted); padding: 0 18px 16px; }
  @media (max-width: 420px) { .raster { grid-template-columns: 1fr; } .hero h2 { font-size: 21px; } }
</style>
</head>
<body>
<header class="kopf">
  <h1>Terracotta-Varianten für vaiacon.ch</h1>
  <p>Je Karte: Startbereich, Farbband (Abschnitte und Fusszeile), Knopf, Link und kleine Überschrift. Gestrichelt umrandet ist der heutige Stand. Mit der Maus über einen Knopf zeigt die Farbe beim Darüberfahren.</p>
</header>
<main class="raster" id="raster"></main>
<script>
  var V = [
    { k: 'heute', n: 'Heute', d: 'Orange mit Rostbraun', hero: ['#FA8C4A','#EB702B','#B24009','#862A03'], sec: ['#A83A08','#D75A20'], btn: '#E2652C', btnh: '#F4793E', link: '#B25222', deep: '#A83A08' },
    { k: 'A', n: 'A · Ziegel', d: 'klassisches Terracotta, warm', hero: ['#EE9A76','#D8724D','#AE4F2E','#77311E'], sec: ['#9E4429','#C8653F'], btn: '#C2613F', btnh: '#D27250', link: '#A84E30', deep: '#93402A' },
    { k: 'B', n: 'B · Gebrannter Ton', d: 'zwischen heute und Terracotta', hero: ['#F5A273','#E07A4E','#B5532E','#80351D'], sec: ['#A5461F','#D16B3F'], btn: '#CC6A42', btnh: '#DB7B52', link: '#A9512E', deep: '#9A431F' },
    { k: 'C', n: 'C · Ziegelrot', d: 'rötlicher, kräftig', hero: ['#EC917A','#D0604A','#A6402D','#6C2318'], sec: ['#93362A','#C2533F'], btn: '#BA4A36', btnh: '#CB5A45', link: '#9E3E2A', deep: '#8A3324' },
    { k: 'D', n: 'D · Erdig', d: 'gedämpft, staubig, ruhig', hero: ['#E2A487','#C77D5C','#9C5A40','#673A29'], sec: ['#87503A','#B56E50'], btn: '#B5654A', btnh: '#C4755A', link: '#95533B', deep: '#7E4733' },
    { k: 'E', n: 'E · Siena', d: 'dunkel und edel', hero: ['#DE8D61','#BC623C','#8E4426','#5A2917'], sec: ['#7C3A20','#AE5833'], btn: '#A9542F', btnh: '#BA643D', link: '#8E4426', deep: '#7C3A20' },
    { k: 'F', n: 'F · Rosé-Ton', d: 'heller, rosiger Ton (Tontöpfe)', hero: ['#F2AE92','#DE8566','#BC6246','#86412E'], sec: ['#A9563D','#D5805F'], btn: '#C96F52', btnh: '#D87F62', link: '#A65A40', deep: '#97503A' }
  ];
  function lum(h) { var c = [1,3,5].map(function (i) { var v = parseInt(h.substr(i,2),16)/255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*c[0] + .7152*c[1] + .0722*c[2]; }
  function kr(a, b) { var x = lum(a), y = lum(b); return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05)).toFixed(1); }
  var html = V.map(function (v) {
    var hero = 'radial-gradient(72% 52% at 50% 54%, ' + v.hero[0] + ' 0%, ' + v.hero[1] + ' 26%, ' + v.hero[2] + ' 60%, ' + v.hero[3] + ' 100%), ' + v.hero[3];
    var sec = 'linear-gradient(178deg, ' + v.sec[0] + ' 0%, ' + v.sec[1] + ' 100%)';
    var st = '--hero:' + hero + ';--section:' + sec + ';--btn:' + v.btn + ';--btnh:' + v.btnh + ';--link:' + v.link + ';--deep:' + v.deep;
    var farben = [['hell', v.hero[0]], ['mitte', v.hero[1]], ['Knopf', v.btn], ['Link', v.link], ['dunkel', v.hero[3]]];
    return '<section class="v' + (v.k === 'heute' ? ' heute' : '') + '" style="' + st + '">' +
      '<div class="hero"><div class="nav">vaiacon<span class="links"><span>KI-Kompetenz</span><span>Sichtbarkeit</span></span><span class="knopf">Kontakt</span></div>' +
      '<h2>KI, die im Alltag mitarbeitet.</h2><span class="knopf hell">Erstgespräch vereinbaren</span><img src="../assets/vaiacon-buerobot-startseite.webp" alt=""></div>' +
      '<div class="band"></div>' +
      '<div class="inhalt"><div class="kicker">Automationen</div><h3>Weniger Kleinkram.</h3><p>Wiederkehrende Aufgaben laufen von allein. <a href="#">Beispiele ansehen</a></p>' +
      '<div class="zeile"><span class="knopf">Erstanalyse starten</span></div></div>' +
      '<div class="name"><b>' + v.n + '</b><i>' + v.d + '</i></div>' +
      '<div class="muster">' + farben.map(function (f) { return '<div><span style="--c:' + f[1] + '"></span><small>' + f[0] + '<br>' + f[1] + '</small></div>'; }).join('') + '</div>' +
      '<div class="kontrast">Weiss auf Knopf ' + kr('#FFFFFF', v.btn) + ' : 1 · Link auf Creme ' + kr(v.link, '#F4EDE1') + ' : 1</div>' +
      '</section>';
  }).join('');
  document.getElementById('raster').innerHTML = html;
</script>
</body>
</html>
